name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # Untagged builds are installable for testing but carry the fallback version from
      # Directory.Build.props; tagged builds get the real version in release.yaml.
      - name: Package plugin
        run: |
          version="$(dotnet msbuild Jellyfin.Plugin.JellyFix/Jellyfin.Plugin.JellyFix.csproj -getProperty:PluginVersion)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 scripts/package_plugin.py --version "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: JellyFix-${{ env.VERSION }}
          path: dist/JellyFix_${{ env.VERSION }}.zip
          if-no-files-found: error
